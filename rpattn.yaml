apiVersion: v1
kind: Namespace
metadata:
  name: rpattn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpattn
  namespace: rpattn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rpattn
  template:
    metadata:
      labels:
        app: rpattn
    spec:
      containers:
        - name: rpattn
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: site
          hostPath:
            path: /home/rpatt/rpattn/public
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: rpattn
  namespace: rpattn
spec:
  selector:
    app: rpattn
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rpattn
  namespace: rpattn
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: rpattn.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rpattn
                port:
                  number: 80
